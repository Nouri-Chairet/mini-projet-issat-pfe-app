components:
  schemas:
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    Message:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PatchedUpdateAccountRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
        department:
          type: string
        ncin:
          type: string
        age:
          type: integer
        parent_contact:
          type: string
        access_status:
          type: boolean
    PatchedUpdatePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
    RefreshTokenRequest:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        class_id:
          type: string
          format: uuid
        parent_contact:
          type: string
        department:
          type: string
        ncin:
          type: string
        age:
          type: integer
      required:
      - email
      - password
      - role
      - username
    ResetPasswordRequest:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - token
      - uid
    RoleEnum:
      enum:
      - admin
      - teacher
      - student
      type: string
      description: |-
        * `admin` - admin
        * `teacher` - teacher
        * `student` - student
    StudentProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserSummary'
        class_id:
          type: string
          format: uuid
        class_name:
          type: string
        parent_contact:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - class_id
      - class_name
      - created_at
      - id
      - parent_contact
      - user
    TeacherProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserSummary'
        department:
          type: string
        ncin:
          type: string
        age:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - age
      - department
      - id
      - ncin
      - user
    TokenPair:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        role:
          type: string
      required:
      - email
      - id
      - role
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
